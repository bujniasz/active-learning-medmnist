# =============================================================================
# Config for: src/analyze_active_screening.py
#
# Run with:
#   python3 src/analyze_active_screening.py -c configs/analyze_active_screening/default.yaml
#
# This script analyzes results from Active Learning experiments
# and generates summary statistics / tables based on the CSV file.
#
# NOTE:
# The input CSV should be generated by src/run_experiments.py (active mode).
# =============================================================================

# === Input ===
# Path to CSV file with experiment results.
# This file should contain results from multiple AL runs.
results_csv: results/rename-test.csv

# === Output ===
# Directory where analysis results (tables, summaries) will be saved.
out_dir: results/screening-rename-test

# === Metric ===
# Metric used to compare and rank experiments.
# Available:
#   val_mean  - average of acc, f1, auc, ap (recommended)
#   acc
#   f1_macro
#   auc
#   ap
metric: val_mean