# =============================================================================
# Config for: src/run_experiments.py (Active Learning sweep)
#
# Run with:
#   python3 -m src.run_experiments -c configs/run_experiments/active/default.yaml
#
# This config is used for MULTIPLE Active Learning experiments.
#
# Unlike train_active.yaml:
#   - here you can provide MULTIPLE values as lists,
#   - all combinations are executed as a Cartesian product.
#
# Example:
#   seeds: [1, 24]
#   strategies: [entropy, mc_entropy]
#   epochs_per_cycles: [1, 5]
#
# This gives:
#   2 seeds x 2 strategies x 2 epc values = 8 experiments
#
# === Mode ===
# Must be "active" for Active Learning experiments.
mode: active

# === Execution ===
# Python executable used to launch training scripts.
python: python3

# Path to train_active.py script.
train_script: src/training/train_active.py

# If true:
#   delete results_csv before running new experiments.
overwrite_results: false

# === Output ===
# Path to the experiment CSV file.
# Results from newly executed experiments will be appended to this CSV.
#
# Example:
#   results_csv: results/my-experiment/name.csv
#
# Model checkpoints are saved automatically under:
#   models/<results_csv_without_results_prefix_and_suffix>/<dataset>/
#
# Example:
#   results_csv: results/my-experiment/new.csv
#
# Active checkpoints:
#   models/my-experiment/new/bloodmnist/...
#   models/my-experiment/new/pneumoniamnist/...
#
results_csv: results/run-woplots/2705-pt2.csv

# =============================================================================
# Experiment grid
#
# Fields below define the experiment grid. All combinations are executed.
# =============================================================================

# === Data ===
# List of dataset directories used for running experiments.
# Example:
#   data_dirs:
#     - data/bloodmnist
#     - data/pathmnist
data_dirs:
  - data/pneumoniamnist


# === Reproducibility ===
# List of random seeds.
# Each seed defines one independent run.
seeds:
  - 33333


# === Strategies ===
# List of Active Learning query strategies.
# Each strategy defines one part of the experiment grid.
#
# Available:
#   random
#   least_confident
#   margin
#   entropy
#   mc_entropy
#   mc_bald
#   entropy_diverse
#   mc_entropy_diverse
#   mc_bald_diverse
#   egl_fc
strategies:
  - random

# === Active Learning mode ===
# How to specify init size, budget and batch size.
#
# Available:
#   percent
#     use *_pcts fields below
#
#   absolute
#     use absolute integer fields below
#
al_mode: percent

# === Percent mode ===
# Used when al_mode: percent.
# These lists are combined into the experiment grid.
#
# init_size_pcts:
#   initial labeled set size as % of train set.
#
# batch_pcts_of_budget:
#   query batch size as % of resolved budget.
#
# budget_pcts:
#   total labeling budget as % of train set.
init_size_pcts:
  - 1

batch_pcts_of_budget:
  - 20

budget_pcts:
  - 30

# === Absolute mode ===
# Used when al_mode: absolute.
# These lists are combined into the experiment grid.
#
# init_sizes:
#   initial labeled set size as number of samples.
#
# batches:
#   query batch size as number of samples per AL cycle.
#
# budgets:
#   total labeling budget as number of queried samples.
init_sizes: null
batches: null
budgets: null

# === Training ===
# Number of training epochs after each Active Learning query cycle.
# Each value defines one part of the experiment grid.
epochs_per_cycles:
  - 3
