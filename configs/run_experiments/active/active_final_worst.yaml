# =============================================================================
# Config for: src/run_experiments.py (Active Learning sweep)
#
# Run with:
#   python3 -m src.run_experiments -c configs/run_experiments/active/active_final_worst.yaml
#
# Final Active Learning strategy comparison using the WORST hyperparameter setup
# identified from the BloodMNIST screening.
#
# Screening dataset:
#   - bloodmnist
#
# Final evaluation datasets:
#   - octmnist
#   - pathmnist
#   - pneumoniamnist
#
# Worst hyperparameters from screening:
#   - init_size_pct: 1
#   - batch_pct_of_budget: 10
#   - budget_pct: 10
#   - epochs_per_cycle: 1
#
# This config runs:
#   3 datasets x 6 strategies x 5 seeds = 90 runs
# =============================================================================

# === Mode ===
mode: active

# === Execution ===
python: python3

train_script: src/training/train_active.py

# If true: skip training and only generate plots from existing CSV.
no_run: false

# IMPORTANT:
# Set to true only if you want to delete existing results before running.
overwrite_results: false

# === Data ===
# BloodMNIST is intentionally excluded here because it was used for screening.
data_dirs:
  - data/octmnist
  - data/pathmnist
  - data/pneumoniamnist

# === Output ===
results_csv: results/final_active_worst.csv

out_dir: results/final_active_worst

# === Reproducibility ===
# Same seeds as in the screening experiment.
seeds:
  - 17
  - 246
  - 9012
  - 34895
  - 148932

# === Strategies ===
# Limited to 6 strategies for plot readability.
#
# Selected to cover:
#   - passive/random baseline
#   - classic uncertainty sampling
#   - BALD-style uncertainty
#   - diversity-aware uncertainty
#   - diversity-aware BALD
#   - gradient-based querying
strategies:
  - random
  - entropy
  - mc_bald
  - entropy_diverse
  - mc_bald_diverse
  - egl_fc

# === Active Learning mode ===
al_mode: percent

# === Percent mode ===
# WORST setup identified from screening.
init_size_pcts:
  - 1

batch_pcts_of_budget:
  - 10

budget_pcts:
  - 10

# === Absolute mode ===
# Not used when al_mode: percent.
init_sizes: null
batches: null
budgets: null

# === Training ===
epochs_per_cycles:
  - 1

# === Plot filters ===
# Set to null to include all datasets.
datasets: null