# =============================================================================
# Config for: src/analysis/analyze_active_strategies.py
#
# Run with:
#   python3 -m src.analysis.analyze_active_strategies -c configs/analysis/analyze_active_strategies/default.yaml
#
# This script analyzes the final active learning strategy comparison.
# It generates validation AULC summaries, final test summaries, active-learning
# strategy rankings, overall test rankings, supervised validation baselines,
# time-to-baseline tables, validation metric plots, train-loss plots and
# aggregated confusion matrices.
#
# NOTE:
# The active input CSV should be generated by src/run_experiments.py (active mode).
# The supervised input CSV is optional, but needed for validation baseline lines
# and time-to-baseline analysis.
# =============================================================================

# === Inputs ===
# Path to CSV file with active learning strategy comparison results.
active_results_csv: results/final_active_best.csv

# Optional path to CSV file with supervised experiment results.
# Set to null to disable supervised validation baselines and time-to-baseline.
supervised_results_csv: results/final_supervised.csv

# === Output ===
# Directory where analysis results (tables and plots) will be saved.
out_dir: results/active_strategies_final

# === Filters ===
# Optional dataset filter. Set to null to use all datasets present in the CSV.
datasets:
  - octmnist
  - pathmnist
  - pneumoniamnist

# Optional strategy filter. Set to null to use all strategies present in the CSV.
strategies:
  - random
  - entropy
  - mc_bald
  - entropy_diverse
  - mc_bald_diverse
  - egl_fc

# Validation/test metrics used in summaries, plots and rankings.
metrics:
  - acc
  - f1_macro
  - auc
  - ap

# === Plots ===
# Generate one validation-metric figure per dataset and metric.
# If supervised_results_csv is provided, dashed horizontal supervised baselines
# are added for each metric.
plot_validation: true

# Generate one train-loss figure per dataset.
plot_train_loss: true

# Generate one aggregated confusion matrix per dataset and strategy.
plot_confusion: true
