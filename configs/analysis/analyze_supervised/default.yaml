# =============================================================================
# Config for: src/analysis/analyze_supervised.py
#
# Run with:
#   python3 -m src.analysis.analyze_supervised -c configs/analysis/analyze_supervised/default.yaml
#
# This script analyzes final results from supervised learning experiments.
# It generates summary statistics based on test metrics and optionally creates
# aggregated confusion matrices.
#
# NOTE:
# The input CSV should be generated by src/run_experiments.py (supervised mode).
# =============================================================================

# === Input ===
# Path to CSV file with supervised experiment results.
# This file should contain final test rows for multiple datasets and seeds.
results_csv: results/final_supervised.csv

# === Output ===
# Directory where analysis results (tables and plots) will be saved.
out_dir: results/final_supervised

# === Plots ===
# Whether to generate a plot with aggregated confusion matrices.
# Confusion matrices are aggregated across seeds for each dataset.
plot_confusion: true
